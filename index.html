const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];let pin='';$('#keypad').innerHTML=keys.map(k=>{if(!k)return '<button class="blank" tabindex="-1" aria-hidden="true"></button>';if(k==='⌫')return '<button data-k="⌫" class="deletekey" aria-label="마지막 숫자 지우기">삭제</button>';return `<button data-k="${k}">${k}<span class="letters">${({'2':'ABC','3':'DEF','4':'GHI','5':'JKL','6':'MNO','7':'PQRS','8':'TUV','9':'WXYZ'})[k]||''}</span></button>`}).join('');function updatePin(){ $('#dots').textContent=Array.from({length:4},(_,i)=>i<pin.length?'●':'○').join('　'); }function unlockIfCorrect(){if(pin.length===4){if(pin==='1018'){state.unlocked=true;$('#passpanel').style.display='none';$('#lock').style.display='none';$('#home').classList.add('show');}else{setTimeout(()=>{if(!state.unlocked){pin='';updatePin();toast('암호가 올바르지 않습니다.')}},250)}}}$('#keypad').addEventListener('click',e=>{let btn=e.target.closest('button'),k=btn&&btn.dataset.k;if(!k)return;if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;updatePin();unlockIfCorrect()});
$('#lock').addEventListener('click',()=>{$('#lock').style.display='none';$('#passpanel').style.display='flex';});$('#homebar').onclick=()=>{if($('#viewer').style.display==='flex'){closeViewer();return}if(state.app){goHome();return}if(!state.unlocked){$('#lock').style.display='none';$('#passpanel').style.display='flex'}};
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(el._timer);el._timer=setTimeout(()=>el.style.display='none',2400)}
function openApp(name){if(name==='gallery'){toast('사용할 수 없는 앱입니다.');return}if(!state.unlocked){$('#lock').style.display='none';$('#passpanel').style.display='flex';return}state.app=name;$('#home').classList.remove('show');$('#appview').classList.add('active');$('#appTitle').textContent=({kakao:'카카오톡',phone:'전화',contacts:'연락처',gallery:'사진',x:'X',calendar:'캘린더',camera:'카메라',facetime:'FaceTime',instagram:'Instagram',notes:'메모',safari:'Safari',settings:'설정'})[name]||name;$('#headAction').textContent=name==='gallery'?'추가':name==='kakao'?'편집':'···';renderApp(name);}
function goHome(){state.app=null;state.chat=null;$('#appview').classList.remove('active');$('#home').classList.add('show');$('#viewer').style.display='none'}function headAction(){if(state.app==='gallery')$('#photoUpload').click();else if(state.app==='kakao')toast('대화 목록입니다. 인물을 선택하세요.');else toast('추가 기능');}
function renderApp(name){const c=$('#appContent');if(name==='kakao')renderKakao(c);else if(name==='phone')renderPhone(c);else if(name==='contacts')renderContacts(c);else if(name==='gallery')renderGallery(c);else if(name==='x')renderX(c);else if(name==='calendar')renderCalendar(c);else if(name==='camera')renderCamera(c);else if(name==='facetime')renderFace(c);else if(name==='instagram')renderInstagram(c);else if(name==='notes')renderNotes(c);else if(name==='safari')renderSafari(c);else if(name==='settings')renderSettings(c)}
function renderKakao(c){c.innerHTML='';if(state.chat){renderChatRoom(c,state.chat);return}const top=document.createElement('div');top.className='gallerytools';top.innerHTML='<b style="font-size:22px">채팅</b><span>⌕　＋</span>';c.append(top);const list=document.createElement('div');list.className='chatlist';['율리아 체링겐','나르케 파르네세','뮐러','엘리아스 호엔촐레른'].forEach(n=>{const b=document.createElement('button');b.className='chatrow';let preview=n==='율리아 체링겐'?'ㅋㅋㅋㅋ 뭘 의도하는지 알겠네~ 나한테 맡겨봐.':n==='나르케 파르네세'?'안 되겠네~ 내가 네 방에서 자는 게 좋겠어.':n==='뮐러'?(state.mullerStarted?'저희 만날까요?':''):'그럼? 왜 저걸 지켜보겠다는 거야?';b.innerHTML=`<span class="avatar">${n==='율리아 체링겐'?'율':n==='나르케 파르네세'?'나':n==='뮐러'?'뮐':'엘'}</span><span class="chatinfo"><span class="chatname">${n}</span><div class="preview">${preview}</div></span><span class="time">${n==='뮐러'&&state.mullerStarted?'방금':''}${n==='뮐러'&&state.mullerStarted?'<span class="unread">3</span>':''}</span>`;b.onclick=()=>{if(n==='뮐러'&&!state.mullerStarted){state.mullerStarted=true;mullerTexts.forEach((t,i)=>setTimeout(()=>{chats['뮐러'].push(['other',t,nowTime()]);notice('뮐러',t);if(state.chat==='뮐러'&&$('#chatmessages'))addBubble($('#chatmessages'),'other',t,nowTime())},i*2000+2000))}state.chat=n;if(n==='나르케 파르네세')state.narUnread=0;renderKakao(c)};list.append(b)});c.append(list);c.insertAdjacentHTML('beforeend','<div class="mutedtext">프로필 사진은 기본 프로필 스타일로 표시됩니다. 대화창에서 메시지를 보내 보세요.</div>');}
function renderChatRoom(c,n){const bar=document.createElement('div');bar.className='profilebar';bar.innerHTML=`<button onclick="state.chat=null;renderKakao($('#appContent'))">‹</button><span class="avatar" style="width:32px;height:32px;font-size:13px">${n[0]}</span><span class="pname">${n}</span>`;c.append(bar);const room=document.createElement('div');room.className='chatroom show';const messages=document.createElement('div');messages.className='chatmessages';messages.id='chatmessages';let arr=chats[n];arr.forEach(m=>addBubble(messages,m[0],m[1],m[2],n==='나르케 파르네세'&&m[0]==='me'));room.append(messages);const form=document.createElement('form');form.className='composer';form.innerHTML='<input id="chatinput" autocomplete="off" placeholder="메시지 입력"><button type="submit">➤</button>';form.onsubmit=e=>{e.preventDefault();let v=$('#chatinput').value.trim();if(!v)return;addBubble(messages,'me',v,new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),n==='나르케 파르네세');$('#chatinput').value='';messages.scrollTop=messages.scrollHeight;if(n==='나르케 파르네세')return;if(n==='율리아 체링겐'){let ans=/율리아.*(부탁|이런 게)|친한 척|의도/.test(v)?'아, 친구니까~':v.includes('고마워')?'뭘. 별 거 아닌데.':'하하. 그래.';setTimeout(()=>addBubble(messages,'other',ans,nowTime()),3000)}else if(n==='뮐러'){['지금 답장해준 거예요?','역시 제 진심이 당신에게 닿았네요.','저희 만날까요?'].forEach((t,i)=>setTimeout(()=>addBubble(messages,'other',t,nowTime()),(i+1)*2000))}else if(n==='엘리아스 호엔촐레른'){let lower=v.toLowerCase();if(v.includes('첫째로, 죄질이 약해'))setTimeout(()=>addBubble(messages,'other','…그럴 건수가 없긴 하네. 사실 생각해 보면 장갑 절도범도 그렇게 진지하게 찾아 줄 것 같지가 않아. 나르케의 예지를 말해 준다면 괜히 황실에서 나르케를 데리고 가서 어떻게 정보를 더 얻을 수 없는지 심문하려 들 것 같고.',nowTime()),5000);else if(v.includes('바보'))setTimeout(()=>addBubble(messages,'other','뭐어?! 바보라니!',nowTime()),3000);else if(v.includes('뭐야?'))setTimeout(()=>addBubble(messages,'other','뭐가?',nowTime()),3000);else if(v.includes('사랑해')||v.includes('좋아해')){setTimeout(()=>addBubble(messages,'other','우어어어엉….',nowTime()),3000);setTimeout(()=>addBubble(messages,'other','감동이야!',nowTime()),5000)}else setTimeout(()=>addBubble(messages,'other','?ㅋㅋㅋㅋ 루카 그럼 고생하고~~',nowTime()),3000)}};room.append(form);c.append(room);setTimeout(()=>messages.scrollTop=messages.scrollHeight,20)}
function nowTime(){return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}function addBubble(box,who,text,time,unread=false){const row=document.createElement('div');row.className='msg '+(who==='me'?'me':'other');row.innerHTML=`${unread?'<span class="readmark">1</span>':''}<div class="bubble"></div><span class="msgtime">${time||''}</span>`;row.querySelector('.bubble').textContent=text;box.append(row);box.scrollTop=box.scrollHeight}
function notice(name,text){const n=document.createElement('div');n.className='notice';n.innerHTML=`<strong>●　${name}</strong><small>지금</small><p></p>`;n.querySelector('p').textContent=text;document.querySelector('.screen').append(n);let startY=0;n.addEventListener('touchstart',e=>startY=e.touches[0].clientY);n.addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>25)n.remove()});n.addEventListener('click',()=>n.remove());setTimeout(()=>{if(n.isConnected)n.remove()},6500)}
function renderPhone(c){c.innerHTML='<div class="simplelist"><h3>최근 통화</h3></div>';const list=c.firstChild;for(let i=0;i<30;i++)list.insertAdjacentHTML('beforeend',`<div class="callrow"><span class="red">↙</span><span class="avatar">뮐</span><span class="details"><b class="red">뮐러</b><small>수신 전화 · 부재중</small></span><small>${i===0?'오늘':'어제'}</small></div>`);list.insertAdjacentHTML('beforeend','<div class="callrow"><span class="red">↙</span><span class="avatar">엘</span><span class="details"><b>엘리아스 호엔촐레른</b><small>수신 전화 · 부재중</small></span><small>어제</small></div><div class="callrow"><span class="green">↗</span><span class="avatar">엘</span><span class="details"><b>엘리아스 호엔촐레른</b><small>발신 전화 · 통화 완료</small></span><small>어제</small></div>');}
function renderContacts(c){c.innerHTML='<div class="simplelist"><h3>연락처</h3></div>';people.forEach(n=>c.firstChild.insertAdjacentHTML('beforeend',`<div class="simpleitem"><span><b>${n}</b><br><small>휴대전화</small></span><button onclick="toast('${n}에게 전화 거는 중…')">통화</button></div>`))}
function renderGallery(c){c.innerHTML='<div class="gallerytools"><span>최근 항목</span><button class="primary" onclick="$(\'#photoUpload\').click()">사진 추가</button><input id="photoUpload" type="file" accept="image/*" multiple hidden></div><div class="mutedtext">GitHub 저장소의 images 폴더에 사진을 올리면 사이트 갤러리에 표시할 수 있습니다. 아래에서 기기 사진을 임시로 불러올 수도 있습니다.</div><div class="gallerygrid" id="gallerygrid"></div>';const input=$('#photoUpload');input.onchange=()=>{Array.from(input.files).forEach(f=>{const url=URL.createObjectURL(f);state.photos.push({url,name:f.name});});drawPhotos()};drawPhotos()}
function drawPhotos(){const g=$('#gallerygrid');if(!g)return;g.innerHTML='';if(!state.photos.length){g.innerHTML='<div class="photo-placeholder">사진 없음<br>사진 추가를 눌러 선택</div><div class="photo-placeholder">GitHub images/ 폴더에<br>직접 업로드 가능</div><div class="photo-placeholder">사진을 선택하면<br>여기에 표시됩니다</div>';return}state.photos.forEach((p,i)=>{const im=document.createElement('img');im.src=p.url;im.alt=p.name;im.onclick=()=>{ $('#viewerImg').src=p.url;$('#viewer').style.display='flex'};g.append(im)})}function closeViewer(){$('#viewer').style.display='none'}
function renderX(c){if(!state.tweets.length)state.tweets=[{name:'황실 마법사 연합회',handle:'@ImperialMages',time:'8시간',text:'[공식 안내] 황실 마법사 연합회 101기 소속 일원에 대한 지속적인 스토킹 행위가 확인되었습니다. 해당 행위는 당사자의 안전과 업무 수행을 침해할 수 있으므로 즉시 중단할 것을 엄중히 경고합니다. 관련 제보는 공식 창구를 통해 접수해 주시기 바랍니다.',views:'800만',likes:'5만',rt:'6만'},{name:'마법사 소식통',handle:'@magic_daily',time:'2시간',text:'오늘 중앙 광장에서 열린 마력 안정화 시연, 예상보다 훨씬 많은 인파가 몰렸습니다. 현장 통제에 협조해 주신 시민 여러분께 감사드립니다.',views:'24만',likes:'1.2만',rt:'8,430'},{name:'익명의 관측자',handle:'@north_archive',time:'1시간',text:'요즘 황궁 주변 경비가 눈에 띄게 늘어난 것 같은데, 다들 무슨 일인지 들은 거 있나요?',views:'9.8만',likes:'3,201',rt:'1,029'}];c.innerHTML='<div class="tweetcompose"><span class="avatar">루</span><textarea id="tweetText" placeholder="무슨 일이 일어나고 있나요?"></textarea><button class="primary" onclick="postTweet()">게시</button></div><div id="tweetlist"></div>';drawTweets()}
function drawTweets(){const l=$('#tweetlist');if(!l)return;l.innerHTML='';state.tweets.forEach((t,i)=>{if(typeof t.liked==='undefined')t.liked=false;const el=document.createElement('article');el.className='tweet';el.innerHTML=`<div class="tweethead"><span class="avatar">${t.name==='루카스 아스카니엔'?'루':t.name[0]}</span><div><strong>${t.name}</strong> <span class="handle">${t.handle} · ${t.time}</span></div></div><p></p><div class="metrics"><span onclick="toast('답글 기능')">♡　${t.likes}</span><span onclick="t.rt=String(Number((t.rt||'0').replace(/\D/g,''))+1);drawTweets()">↻　${t.rt}</span><span>◉　${t.views}</span><button class="likebtn ${t.liked?'liked':''}" aria-label="좋아요" aria-pressed="${t.liked?'true':'false'}" onclick="toggleLike(${i})"><span>${t.liked?'♥':'♡'}</span> 좋아요</button></div>`;el.querySelector('p').textContent=t.text;l.append(el)})}
function toggleLike(i){const t=state.tweets[i];if(!t)return;t.liked=!t.liked;drawTweets()}
function postTweet(){const ta=$('#tweetText'),v=ta.value.trim();if(!v)return;state.tweets.unshift({name:'루카스 아스카니엔',handle:'@lucas_askanien',time:'방금',text:v,views:'0',likes:'0',rt:'0'});ta.value='';drawTweets();$('#appContent').scrollTop=0;toast('게시물이 게시되었습니다.')}
function renderCalendar(c){c.innerHTML='<div style="padding:18px;background:white"><div style="color:#ef4545;font-size:13px">2026년 10월</div><h2>10월</h2><div class="calgrid" id="calgrid"></div></div><div class="simplelist"><div class="simpleitem"><span><b>오늘</b><br><small>수사 일정 확인</small></span><span>종일</span></div><div class="simpleitem"><span><b>전략회의</b><br><small>황실 마법사 연합회</small></span><span>16:00</span></div><button class="primary" onclick="toast(&quot;새로운 일정 추가&quot;)">＋ 일정 추가</button></div>';let g=$('#calgrid');['일','월','화','수','목','금','토'].forEach(d=>g.insertAdjacentHTML('beforeend',`<div style="font-weight:700;color:#888">${d}</div>`));for(let i=1;i<=31;i++)g.insertAdjacentHTML('beforeend',`<div class="${i===24?'today':''}">${i}</div>`)}

function renderFace(c){c.innerHTML='<div class="simplelist"><h3>FaceTime</h3><div class="simpleitem"><span>율리아 체링겐</span><button onclick="toast(\'FaceTime 연결을 시도합니다.\')">영상 통화</button></div><div class="simpleitem"><span>나르케 파르네세</span><button onclick="toast(\'FaceTime 연결을 시도합니다.\')">영상 통화</button></div><div class="simpleitem"><span>엘리아스 호엔촐레른</span><button onclick="toast(\'FaceTime 연결을 시도합니다.\')">영상 통화</button></div></div>'}
function renderInstagram(c){c.innerHTML='<div class="simplelist"><h3>Instagram</h3><div class="tweet"><div class="tweethead"><span class="avatar">루</span><strong>루카스 아스카니엔</strong></div><p>오늘도 평온한 하루가 되기를.</p><div style="height:180px;background:linear-gradient(135deg,#d6d9e5,#8c95ad,#ddd0c9);border-radius:8px"></div><p>♡　좋아요　　댓글 달기</p></div><div class="simpleitem">스토리　<span>＋</span></div><div class="mutedtext">게시물에 댓글을 남길 수 있는 데모 화면입니다.</div><input placeholder="댓글 입력" style="margin:10px;padding:12px;width:90%;border:1px solid #ddd;border-radius:10px" onkeydown="if(event.key===&quot;Enter&quot;){toast(&quot;댓글이 추가되었습니다.&quot;);this.value=&quot;&quot;}"></div>'}

function renderSettings(c){c.innerHTML='<div class="simplelist"><div class="simpleitem"><span>비밀번호</span><b>1018</b></div><div class="simpleitem"><span>배경화면</span><button onclick="toast(\'배경화면 설정은 데모 기능입니다.\')">변경</button></div><div class="simpleitem"><span>잠금</span><button onclick="lockPhone()">지금 잠그기</button></div><p class="mutedtext">이 웹사이트는 단일 HTML 기반의 인터랙티브 팬 프로젝트입니다. 실제 전화·메시지·FaceTime 통신은 연결되지 않습니다.</p></div>'}
